<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relicário</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="sr-only" href="#view" id="skip">Pular para o conteúdo</a>
<div class="win">
  <div class="body" id="shell" hidden>
    <aside class="side">
      <div class="logo">
        <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M13 2 L22 7 V15 C22 20 18 23 13 24 C8 23 4 20 4 15 V7 Z" fill="none" stroke="var(--brass)" stroke-width="2"/><circle cx="13" cy="13" r="3.2" fill="var(--brass)"/></svg>
        <b>Relicário</b>
      </div>
      <nav class="nav" id="appnav" aria-label="Principal">
        <a href="#biblioteca" data-r="biblioteca"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="11" y="3" width="6" height="6" rx="1.5"/><rect x="3" y="11" width="6" height="6" rx="1.5"/><rect x="11" y="11" width="6" height="6" rx="1.5"/></svg><span data-t="nav.library"></span></a>
        <a href="#conflitos" data-r="conflitos"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 3v6a4 4 0 0 0 4 4h0M14 3v6a4 4 0 0 1-4 4v4"/><circle cx="6" cy="3" r="1.4"/><circle cx="14" cy="3" r="1.4"/></svg><span data-t="nav.conflicts"></span><span class="count" id="ccount" hidden></span></a>
        <a href="#atividade" data-r="atividade"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 10h3l2-5 4 10 2-5h3"/></svg><span data-t="nav.activity"></span></a>
        <a href="#dispositivos" data-r="dispositivos"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2.5" y="4" width="10" height="7" rx="1.2"/><path d="M5 14h5M7.5 11v3"/><rect x="14" y="6" width="4" height="9" rx="1"/></svg><span data-t="nav.devices"></span></a>
        <a href="#ajustes" data-r="ajustes"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 6h8M15 6h1M4 14h1M8 14h8"/><circle cx="13.5" cy="6" r="1.8"/><circle cx="6.5" cy="14" r="1.8"/></svg><span data-t="nav.settings"></span></a>
      </nav>
      <div class="machines" id="machines" aria-live="polite"></div>
    </aside>
    <div class="main">
      <div class="topbar">
        <label class="search"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="m13.5 13.5 3.5 3.5"/></svg><input id="q" data-tp="search.placeholder" data-ta="search.label"><kbd>/</kbd></label>
        <div class="syncstate" id="syncstate" role="status"></div>
      </div>
      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>
  <main class="view" id="wizard" hidden tabindex="-1"></main>
</div>
<div id="modal"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
