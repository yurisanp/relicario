[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yurisanp/relicario"
authors = ["Os autores do Relicário"]
publish = false

[workspace.dependencies]
relicario-model = { path = "crates/relicario-model" }
relicario-engine = { path = "crates/relicario-engine" }
relicario-store = { path = "crates/relicario-store" }
relicario-catalog = { path = "crates/relicario-catalog" }
relicario-watch = { path = "crates/relicario-watch" }
relicario-transport = { path = "crates/relicario-transport" }
relicario-platform = { path = "crates/relicario-platform" }
relicario-daemon = { path = "crates/relicario-daemon" }
relicario-plugins = { path = "crates/relicario-plugins" }
relicario-p2p = { path = "crates/relicario-p2p" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = "1"
zstd = "0.13"
fastcdc = "3"
globset = "0.4"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.3"
proptest = "1"
serde_yaml_ng = "0.10"
glob = "0.3"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
winreg = "0.56"
interprocess = "2"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
tempfile = "3"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "io-util", "sync"] }
spake2 = "0.4"
mdns-sd = "0.13"
chacha20poly1305 = "0.10"
argon2 = "0.5"
sha2 = "0.10"
sha1 = "0.10"
zip = { version = "9.8", default-features = false, features = ["deflate"] }
rpassword = "7"
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-decode", "frame"] }
flate2 = "1"
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
opendal-http-transport-reqwest = { version = "0.59", default-features = false, features = ["rustls-no-provider"] }
opendal = { version = "0.59", default-features = false, features = ["executors-tokio", "http-transport-reqwest-rustls-no-provider", "layers-retry", "layers-timeout", "services-s3", "services-webdav", "services-gdrive", "services-memory", "services-fs"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

# Criptografia e compressão otimizadas também nos testes (Argon2 em debug é lento demais).
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.zstd-sys]
opt-level = 3
