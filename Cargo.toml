[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yurisanp/relicario"
authors = ["Os autores do Relicário"]
publish = false

[workspace.dependencies]
relicario-model = { path = "crates/relicario-model" }
relicario-engine = { path = "crates/relicario-engine" }
relicario-store = { path = "crates/relicario-store" }
relicario-catalog = { path = "crates/relicario-catalog" }
relicario-watch = { path = "crates/relicario-watch" }
relicario-transport = { path = "crates/relicario-transport" }
relicario-platform = { path = "crates/relicario-platform" }
relicario-daemon = { path = "crates/relicario-daemon" }
relicario-plugins = { path = "crates/relicario-plugins" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
